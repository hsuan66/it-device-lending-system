<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 藍色圓角底，使用 Element Plus 主色，跟系統的按鈕、選單同色 -->
  <rect width="32" height="32" rx="7" fill="#409EFF"/>
  <!-- 筆電螢幕 -->
  <rect x="7" y="7.5" width="18" height="12.5" rx="1.5" fill="none" stroke="#fff" stroke-width="2"/>
  <!-- 筆電底座 -->
  <path d="M4.5 23.5h23" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 借出、歸還的雙向箭頭 -->
  <path d="M11.5 12h8l-2-2M20.5 15.5h-8l2 2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
